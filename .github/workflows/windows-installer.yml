name: Générer l'installateur Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Exécuter les tests
        run: npm test
      - name: Vérifier le vrai moteur de filtrage DevGitShield
        run: node tests/adblocker-runtime-smoke.js
      - name: Vérifier la compilation du moteur MSHTML Windows
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File legacy/embedded-ie.ps1 -CompileOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compiler le moteur IE11 dédié pour Windows
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (!(Test-Path $compiler)) { throw 'Compilateur .NET Framework 64 bits manquant.' }
          $source = (Resolve-Path 'legacy/DevGitLegacyHost.cs').Path
          $out = Join-Path (Get-Location).Path 'legacy/DevGitLegacyHost.exe'
          & $compiler /nologo /target:exe "/out:$out" /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "$source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path legacy/DevGitLegacyHost.exe)) { throw 'Programme IE11 dédié absent.' }
      - name: Compiler le moteur IE11 32 bits pour CamfrogWeb
        shell: pwsh
        run: |
          $compiler32 = Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          if (!(Test-Path $compiler32)) { throw 'Compilateur .NET Framework 32 bits manquant.' }
          $source = (Resolve-Path 'legacy/DevGitLegacyHost.cs').Path
          $out = Join-Path (Get-Location).Path 'legacy/DevGitLegacyHost32.exe'
          & $compiler32 /nologo /target:exe /platform:x86 "/out:$out" /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "$source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path legacy/DevGitLegacyHost32.exe)) { throw 'Hôte IE x86 absent.' }
      - name: Vérifier MSHTML IE11 en 64 bits
        run: node tests/windows-ie-smoke.js DevGitLegacyHost.exe
      - name: Vérifier MSHTML IE11 et fenêtres de salon en 32 bits
        run: node tests/windows-ie-smoke.js DevGitLegacyHost32.exe
      - name: Compiler DevGitBrowser pour Windows x64
        run: npm run build:win
      - name: Contrôler MatchPulse et la mise à jour dans le paquet Windows
        run: node tests/check-windows-bundle.js
      - name: Vérifier les listes DevGitShield en ligne (YouTube / Twitch)
        run: node tests/adblocker-lists-smoke.js
        continue-on-error: true
      - name: Conserver l'installateur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: DevGitBrowser-Installateur-Windows
          path: |
            dist/DevGitBrowser-Setup-*.exe
            dist/DevGitBrowser-Setup-*.exe.blockmap
            dist/latest.yml
      # Chaque nouvelle version poussée sur main devient une release GitHub :
      # les navigateurs installés la détectent et se mettent à jour seuls.
      - name: Publier la release pour la mise à jour automatique
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if (!(Test-Path dist/latest.yml)) { throw 'dist/latest.yml absent : mise à jour automatique impossible.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "La release $tag existe déjà : aucune publication."; exit 0 }
          $notes = "Voir CHANGELOG.md"
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($changelog, "(?ms)^##\s+$([regex]::Escape($version)).*?(?=\r?\n## |\z)")
          if ($m.Success) { $notes = $m.Value }
          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8
          gh release create $tag --repo $env:GITHUB_REPOSITORY --title "DevGitBrowser $version" --notes-file release-notes.md --target $env:GITHUB_SHA `
            "dist/DevGitBrowser-Setup-$version.exe" "dist/DevGitBrowser-Setup-$version.exe.blockmap" dist/latest.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if-no-files-found: error
          retention-days: 30
      - name: Publier un EXE direct dans GitHub Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/DevGitBrowser-Setup-*.exe --clobber
          else
            gh release create "$TAG" dist/DevGitBrowser-Setup-*.exe \
              --title "DevGitBrowser $(node -p "require('./package.json').version") — Windows" \
              --notes "Installateur Windows x64 NSIS. Compilé automatiquement par GitHub Actions. Ce fichier n'est pas signé avec un certificat Authenticode." \
              --target "$GITHUB_SHA"
          fi
