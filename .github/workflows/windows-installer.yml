name: Générer l'installateur Windows EXE
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Installer Electron castLabs (Widevine)
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if (!(Test-Path node_modules/electron/dist/electron.exe)) { throw 'Binaires Electron castLabs absents (node_modules/electron/dist).' }
          Write-Host "Electron castLabs : $((Get-Content node_modules/electron/package.json -Raw | ConvertFrom-Json).version)"
      - name: Exécuter les tests
        run: npm test
      - name: Vérifier le vrai moteur de filtrage DevGitShield
        run: node tests/adblocker-runtime-smoke.js
      - name: Vérifier la compilation du moteur MSHTML Windows
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File legacy/embedded-ie.ps1 -CompileOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compiler le moteur IE11 dédié pour Windows
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (!(Test-Path $compiler)) { throw 'Compilateur .NET Framework 64 bits manquant.' }
          $source = (Resolve-Path 'legacy/DevGitLegacyHost.cs').Path
          $out = Join-Path (Get-Location).Path 'legacy/DevGitLegacyHost.exe'
          & $compiler /nologo /target:exe "/out:$out" /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "$source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path legacy/DevGitLegacyHost.exe)) { throw 'Programme IE11 dédié absent.' }
      - name: Compiler le moteur IE11 32 bits pour CamfrogWeb
        shell: pwsh
        run: |
          $compiler32 = Join-Path $env:WINDIR 'Microsoft.NET/Framework/v4.0.30319/csc.exe'
          if (!(Test-Path $compiler32)) { throw 'Compilateur .NET Framework 32 bits manquant.' }
          $source = (Resolve-Path 'legacy/DevGitLegacyHost.cs').Path
          $out = Join-Path (Get-Location).Path 'legacy/DevGitLegacyHost32.exe'
          & $compiler32 /nologo /target:exe /platform:x86 "/out:$out" /reference:System.Windows.Forms.dll /reference:System.Drawing.dll "$source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path legacy/DevGitLegacyHost32.exe)) { throw 'Hôte IE x86 absent.' }
      - name: Vérifier MSHTML IE11 en 64 bits
        run: node tests/windows-ie-smoke.js DevGitLegacyHost.exe
      - name: Vérifier MSHTML IE11 et fenêtres de salon en 32 bits
        run: node tests/windows-ie-smoke.js DevGitLegacyHost32.exe
      # VPN DevGit : Tor Expert Bundle officiel, signature GPG de Tor Browser vérifiée.
      - name: Télécharger et vérifier Tor (VPN DevGit)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fetch-tor.js download
          FPR=EF6E286DDA85EA2A4BA7DE684E2C6E8793298290
          gpg --batch --auto-key-locate nodefault,wkd --locate-keys torbrowser@torproject.org \
            || gpg --batch --keyserver hkps://keys.openpgp.org --recv-keys "$FPR"
          gpg --batch --status-fd 1 --verify vendor/tmp/sums.txt.asc vendor/tmp/sums.txt > gpg-status.txt 2>/dev/null || true
          if ! grep -E "^\[GNUPG:\] VALIDSIG .*$FPR" gpg-status.txt; then echo "Signature GPG des sommes Tor invalide"; cat gpg-status.txt; exit 1; fi
          node scripts/fetch-tor.js extract
      # DevGit Video : yt-dlp et FFmpeg intégrés au PC de chaque utilisateur.
      - name: Télécharger et vérifier les outils vidéo locaux
        shell: pwsh
        run: ./scripts/fetch-video-tools.ps1
      - name: Préparer DevGitBrowser pour Windows x64 (dossier)
        run: npm run build:win:dir
      # Lecteur protégé (Netflix, Disney+, Prime Video…) : DevGitMedia.exe est le
      # moteur castLabs d'ORIGINE (seuls l'icône et le nom changent), signé VMP par
      # castLabs EVS. DevGitBrowser.exe garde ses fusibles de sécurité : castLabs
      # refuse de signer un moteur modifié, d'où ce lecteur séparé.
      - name: Lecteur protégé DevGitMedia.exe + signature VMP (castLabs EVS)
        shell: pwsh
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          New-Item -ItemType Directory -Force media-stage | Out-Null
          robocopy node_modules/electron/dist media-stage /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw 'Copie du moteur castLabs impossible.' }
          Rename-Item media-stage/electron.exe DevGitMedia.exe
          npm install --no-save --no-audit --no-fund rcedit@4
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node -e "(require('rcedit').rcedit||require('rcedit'))('media-stage/DevGitMedia.exe',{icon:'assets/icon.ico','file-version':'$version','product-version':'$version','version-string':{ProductName:'DevGitBrowser Media',FileDescription:'Lecteur protégé DevGit',CompanyName:'CodexHempreur INC',LegalCopyright:'CodexHempreur INC',OriginalFilename:'DevGitMedia.exe'}}).then(()=>console.log('DevGitMedia.exe prêt'))"
          if ($LASTEXITCODE -ne 0) { throw 'Préparation de DevGitMedia.exe impossible.' }
          if ([string]::IsNullOrEmpty($env:EVS_ACCOUNT_NAME) -or [string]::IsNullOrEmpty($env:EVS_PASSWD)) {
            Write-Host "::warning::Secrets EVS_ACCOUNT_NAME / EVS_PASSWD absents : lecteur protégé non signé, Netflix refusera la lecture."
          } else {
            python -m pip install --upgrade --quiet castlabs-evs
            $env:EVS_NO_ASK = '1'
            python -m castlabs_evs.account refresh
            if ($LASTEXITCODE -ne 0) { python -m castlabs_evs.account reauth }
            if ($LASTEXITCODE -ne 0) { throw 'Connexion au compte castLabs EVS impossible (vérifie les secrets EVS_ACCOUNT_NAME / EVS_PASSWD).' }
            python -m castlabs_evs.vmp sign-pkg media-stage
            if ($LASTEXITCODE -ne 0) { throw 'Signature VMP du lecteur protégé impossible.' }
            python -m castlabs_evs.vmp verify-pkg media-stage
            if ($LASTEXITCODE -ne 0) { throw 'Signature VMP du lecteur protégé invalide.' }
            Copy-Item media-stage/DevGitMedia.exe.sig dist/win-unpacked/
          }
          Copy-Item media-stage/DevGitMedia.exe dist/win-unpacked/
          $global:LASTEXITCODE = 0
      - name: Construire l'installateur depuis le dossier signé
        run: npm run build:win:installer
      - name: Vérifier les exécutables vidéo dans le paquet Windows
        shell: pwsh
        run: |
          foreach ($name in @('yt-dlp.exe','ffmpeg.exe','ffprobe.exe','deno.exe')) {
            if (!(Test-Path ("dist/win-unpacked/resources/video/" + $name))) { throw "Outil vidéo absent : $name" }
          }
      - name: Contrôler MatchPulse et la mise à jour dans le paquet Windows
        run: node tests/check-windows-bundle.js
      - name: Vérifier les listes DevGitShield en ligne (YouTube / Twitch)
        run: node tests/adblocker-lists-smoke.js
        continue-on-error: true
      - name: Conserver l'installateur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: DevGitBrowser-Installateur-Windows
          path: |
            dist/DevGitBrowser-Setup-*.exe
            dist/DevGitBrowser-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30
      # Chaque nouvelle version poussée sur main devient une release GitHub :
      # les navigateurs installés la détectent et se mettent à jour seuls.
      - name: Publier la release pour la mise à jour automatique
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if (!(Test-Path dist/latest.yml)) { throw 'dist/latest.yml absent : mise à jour automatique impossible.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "La release $tag existe déjà : aucune publication."; exit 0 }
          $notes = "Voir CHANGELOG.md"
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($changelog, "(?ms)^##\s+$([regex]::Escape($version)).*?(?=\r?\n## |\z)")
          if ($m.Success) { $notes = $m.Value }
          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8
          gh release create $tag --repo $env:GITHUB_REPOSITORY --title "DevGitBrowser $version" --notes-file release-notes.md --target $env:GITHUB_SHA `
            "dist/DevGitBrowser-Setup-$version.exe" "dist/DevGitBrowser-Setup-$version.exe.blockmap" dist/latest.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
