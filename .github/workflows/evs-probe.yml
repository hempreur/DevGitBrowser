name: Diagnostic signature VMP (temporaire)
on:
  push:
    branches: [devgitbrowser-1.10.0]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Installer Electron castLabs (Widevine)
        shell: pwsh
        run: node node_modules/electron/install.js
      - name: Lecteur renommé
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          robocopy node_modules/electron/dist probe/media /E /NFL /NDL /NJH /NJS /NP | Out-Null
          Rename-Item probe/media/electron.exe DevGitMedia.exe
          npm install --no-save --no-audit --no-fund rcedit@4
          node -e "(require('rcedit').rcedit||require('rcedit'))('probe/media/DevGitMedia.exe',{icon:'assets/icon.ico','version-string':{ProductName:'DevGitBrowser Media',FileDescription:'Lecteur protégé DevGit'}}).then(()=>console.log('icone OK'))"
          $global:LASTEXITCODE = 0
      - name: Signer et lister
        shell: pwsh
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: '1'
        run: |
          python -m pip install --upgrade --quiet castlabs-evs
          python -m castlabs_evs.account refresh
          python -m castlabs_evs.vmp --help
          python -m castlabs_evs.vmp sign-pkg probe/media
          Write-Host "===== RESULTAT : $LASTEXITCODE ====="
          python -m castlabs_evs.vmp verify-pkg probe/media
          Write-Host "===== VERIFY : $LASTEXITCODE ====="
          Get-ChildItem probe/media -Filter *.sig | ForEach-Object { Write-Host "SIG: $($_.Name) $($_.Length)" }
          exit 0
