name: Diagnostic signature VMP (temporaire)
on:
  push:
    branches: [devgitbrowser-1.10.0]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Installer Electron castLabs (Widevine)
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if (!(Test-Path node_modules/electron/dist/electron.exe)) { throw 'Binaires castLabs absents.' }
      - name: Une variante par fusible
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          foreach ($v in 'RunAsNode','EnableCookieEncryption','EnableNodeOptionsEnvironmentVariable','EnableNodeCliInspectArguments','OnlyLoadAppFromAsar') {
            robocopy node_modules/electron/dist "probe/$v" /E /NFL /NDL /NJH /NJS /NP | Out-Null
            $val = if ($v -eq 'EnableCookieEncryption' -or $v -eq 'OnlyLoadAppFromAsar') { 'true' } else { 'false' }
            node -e "const f=require('@electron/fuses');f.flipFuses('probe/$v/electron.exe',{version:f.FuseVersion.V1,[f.FuseV1Options.$v]:$val}).then(()=>console.log('fusible $v = $val'))"
          }
          $global:LASTEXITCODE = 0
      - name: Signer chaque variante
        shell: pwsh
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: '1'
        run: |
          python -m pip install --upgrade --quiet castlabs-evs
          python -m castlabs_evs.account refresh
          foreach ($v in 'RunAsNode','EnableCookieEncryption','EnableNodeOptionsEnvironmentVariable','EnableNodeCliInspectArguments','OnlyLoadAppFromAsar') {
            Write-Host "===== FUSIBLE $v ====="
            python -m castlabs_evs.vmp sign-pkg "probe/$v"
            Write-Host "===== RESULTAT $v : $LASTEXITCODE ====="
          }
          exit 0
