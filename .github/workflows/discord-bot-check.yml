name: Vérifier DevGitBrowser Bot

on:
  pull_request:
    paths:
      - 'server/discord-bot/**'
      - '.github/workflows/discord-bot-check.yml'
  push:
    paths:
      - 'server/discord-bot/**'
      - '.github/workflows/discord-bot-check.yml'

jobs:
  bot-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/discord-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node --check utils.js
      - run: npm test
