name: Application Android

on:
  pull_request:
    paths: ['android/**', 'package.json', 'i18n/en.json', 'ui/x-catalog.js', 'extensions/matchpulse/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'package.json', 'i18n/en.json', 'ui/x-catalog.js', 'extensions/matchpulse/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Traductions anglaises
        run: python3 android/build-i18n.py

      - name: Clé de signature
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : APK signé avec une clé de test, il ne sera pas publié."
          fi

      - name: Tests et construction de l'APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon --stacktrace testGithubReleaseUnitTest assembleGithubRelease bundlePlayRelease

      - name: Nommer l'APK
        id: apk
        run: |
          v=$(node -p "require('./android/version.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/github/release/app-github-release.apk "dist/DevGitBrowser-Android-$v.apk"
          mkdir -p dist-play
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab "dist-play/DevGitBrowser-PlayStore-$v.aab"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: DevGitBrowser-Android-${{ steps.apk.outputs.version }}
          path: dist/*.apk
          retention-days: 30

      # Paquet pour Google Play (à envoyer à la main dans la Play Console, voir android/PLAY_STORE.md).
      - uses: actions/upload-artifact@v4
        with:
          name: DevGitBrowser-PlayStore-${{ steps.apk.outputs.version }}
          path: dist-play/*.aab
          retention-days: 90

      # Releases Android séparées de Windows : tag « android-v1.0.1 », jamais marquées « latest »
      # (la mise à jour automatique de Windows et le site lisent la dernière release Windows).
      - name: Publier la release Android
        if: github.event_name == 'push' && env.ANDROID_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.apk.outputs.version }}
        run: |
          tag="android-v$V"
          if gh release view "$tag" >/dev/null 2>&1; then echo "La release $tag existe déjà : aucune publication."; exit 0; fi
          channel=$(node -p "require('./android/version.json').channel || ''")
          node -e '
            const fs=require("fs");const v=process.env.V;
            const log=fs.readFileSync("android/CHANGELOG.md","utf8");
            const esc=v.replace(/\./g,"\\.");
            const m=log.match(new RegExp("^## "+esc+"[\\s\\S]*?(?=\\n## |(?![\\s\\S]))","m"));
            fs.writeFileSync("release-notes.md",(m?m[0]:"## "+v).trim()+"\n\n**Installation :** télécharge `DevGitBrowser-Android-"+v+".apk` sur ton téléphone (Android 8 ou plus récent) et ouvre-le.\n");'
          gh release create "$tag" --title "DevGitBrowser Android $V $channel" --notes-file release-notes.md --latest=false --target "$GITHUB_SHA" "dist/DevGitBrowser-Android-$V.apk"
